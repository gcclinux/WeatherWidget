# Flatpak manifest for WeatherWidget
#
# App ID:  uk.co.easysmartapps.WeatherWidget
# Runtime: GNOME Platform 49 (current supported release)
# Build:   Go + native GTK3 (gotk3) + libayatana-appindicator3, CGO enabled.
#
# ---------------------------------------------------------------------------
# OFFLINE BUILD (required by Flathub — the build sandbox has NO network):
#   1. The system tray dependency (libayatana-appindicator) is pulled in from
#      the maintained flathub/shared-modules repo, added as a git submodule of
#      the Flathub app repo (see flatpak/README.md). Do not hand-pin it.
#   2. Go modules are declared in `go.mod.yml` + `modules.txt`, generated by
#      ./generate-sources.sh (which runs dennwc/flatpak-go-mod). These populate
#      ./vendor during the build, so Go builds with -mod=vendor and no network.
# ---------------------------------------------------------------------------
#
# Local test build (from the flatpak/ directory):
#   flatpak install -y flathub org.gnome.Platform//49 org.gnome.Sdk//49 \
#       org.freedesktop.Sdk.Extension.golang//25.08
#   flatpak-builder --user --install --force-clean build-dir \
#       uk.co.easysmartapps.WeatherWidget.yml
#   flatpak run uk.co.easysmartapps.WeatherWidget

app-id: uk.co.easysmartapps.WeatherWidget
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: weatherwidget

finish-args:
  # Weather data is fetched over HTTPS from provider APIs.
  - --share=network
  # GUI: the widget renders with GTK3 and needs a display server.
  # fallback-x11 uses Wayland when available and X11 otherwise, which is the
  # pattern Flathub's linter requires (never raw --socket=x11 with wayland).
  - --socket=fallback-x11
  - --socket=wayland
  # Shared IPC (needed by X11/XWayland shared memory).
  - --share=ipc
  # GPU acceleration for GTK/OpenGL rendering.
  - --device=dri
  # System tray icon via StatusNotifierItem / AppIndicator.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

# The GNOME runtime already provides GTK3, GLib, Cairo, Pango, gdk-pixbuf.
# We only add libayatana-appindicator (tray) and the app itself.

modules:
  # ---------------------------------------------------------------------------
  # System tray support. Provided by the maintained flathub/shared-modules
  # repo, added as a git submodule in the Flathub app repository:
  #   git submodule add https://github.com/flathub/shared-modules.git shared-modules
  # This builds libdbusmenu + libayatana-indicator + libayatana-appindicator
  # from pinned, hashed sources — no manual hash pinning required here.
  # ---------------------------------------------------------------------------
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  # ---------------------------------------------------------------------------
  # WeatherWidget itself
  # ---------------------------------------------------------------------------
  - name: weatherwidget
    buildsystem: simple
    build-options:
      # Make the Go SDK extension available on PATH.
      append-path: /usr/lib/sdk/golang/bin
      env:
        GO111MODULE: 'on'
        CGO_ENABLED: '1'
        # Workspaces confuse vendored builds; disable it in the sandbox.
        GOWORK: 'off'
        # Silence gotk3 / appindicator C header deprecation noise.
        CGO_CFLAGS: '-Wno-deprecated-declarations'
    build-commands:
      # The go.mod.yml + modules.txt sources below have populated ./vendor,
      # so we build with -mod=vendor and never touch the network.
      - |
        set -e
        export GOPATH="$PWD/.gopath"
        VERSION="$(cat release 2>/dev/null | tr -d '[:space:]')"
        [ -z "$VERSION" ] && VERSION="dev"
        go build -v -mod=vendor \
          -ldflags="-s -w -X main.version=${VERSION}" \
          -o weatherwidget \
          ./cmd/weatherwidget-gtk/
      - install -Dm755 weatherwidget /app/bin/weatherwidget
      - install -Dm644 flatpak/uk.co.easysmartapps.WeatherWidget.desktop
          /app/share/applications/uk.co.easysmartapps.WeatherWidget.desktop
      - install -Dm644 flatpak/uk.co.easysmartapps.WeatherWidget.metainfo.xml
          /app/share/metainfo/uk.co.easysmartapps.WeatherWidget.metainfo.xml
      - install -Dm644 assets/icons/day/clear_day.png
          /app/share/icons/hicolor/256x256/apps/uk.co.easysmartapps.WeatherWidget.png
      - install -Dm644 assets/icons/day/clear_day.png
          /app/share/icons/hicolor/128x128/apps/uk.co.easysmartapps.WeatherWidget.png
      - install -Dm644 assets/icons/day/clear_day.png
          /app/share/icons/hicolor/64x64/apps/uk.co.easysmartapps.WeatherWidget.png
    sources:
      - type: dir
        path: ..
      # Generated by ./generate-sources.sh (dennwc/flatpak-go-mod).
      # These populate ./vendor and ./vendor/modules.txt during the build so
      # the Go build works with no network. Keep AFTER the dir source.
      - go.mod.yml
